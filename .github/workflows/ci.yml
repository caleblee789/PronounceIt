name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run pronunciation audit
        run: python3 scripts/audit_pronunciations.py

      - name: Check reviewer JavaScript syntax
        run: node --check web/pronounceit.js

      - name: Compile Python sources
        run: python3 -m compileall __init__.py pronounceit scripts tests
        env:
          PYTHONPYCACHEPREFIX: /tmp/pronounceit_pycache
